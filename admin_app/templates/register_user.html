{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="text-center">Register User</h4>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="user_id" class="form-label">Select User</label>
                        <select id="user_id" name="user_id" class="form-select" required>
                            {% for user in users %}
                            <option value="{{ user.userId }}">{{ user.userId }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="firstname" class="form-label">First Name</label>
                        <input type="text" id="firstname" name="firstname" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="lastname" class="form-label">Last Name</label>
                        <input type="text" id="lastname" name="lastname" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="mobile" class="form-label">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile" class="form-control" required
                               inputmode="numeric" maxlength="10" autocomplete="tel-national"
                               pattern="[0-9]{10}"
                               placeholder="10-digit Indian mobile (e.g. 9876543210)"
                               title="10 digits only; no +91">
                    </div>
                    <div class="mb-3">
                        <label for="location" class="form-label">Location</label>
                        <input type="text" id="location" name="location" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Register User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
  (function () {
    var m = document.getElementById('mobile');
    if (!m) return;
    m.addEventListener('input', function () {
      var d = String(this.value || '').replace(/\D/g, '').slice(0, 10);
      this.value = d;
    });
  })();
</script>
{% endblock %}
