{# Eye button on every password field: tap to show, tap again to hide. #}
<style>
  .pw-wrap { position: relative; display: block; }
  .pw-wrap > input { padding-right: 2.9rem !important; }
  .pw-eye {
    position: absolute; top: 50%; right: .45rem; transform: translateY(-50%);
    width: 2.1rem; height: 2.1rem; display: grid; place-items: center;
    border: 0; background: transparent; border-radius: 8px; padding: 0; cursor: pointer;
    color: #6B7385; z-index: 3; transition: color .15s ease, background .15s ease;
  }
  .pw-eye:hover { color: #0B0D12; background: rgba(11, 13, 18, .06); }
  .pw-eye:focus-visible { outline: 2px solid #FF7A1A; outline-offset: 1px; }
  .pw-eye svg { width: 20px; height: 20px; pointer-events: none; }
  .pw-eye .hide-icon { display: none; }
  .pw-eye[aria-pressed="true"] .show-icon { display: none; }
  .pw-eye[aria-pressed="true"] .hide-icon { display: block; }
</style>
<script>
(function () {
  var EYE = '<svg class="show-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_OFF = '<svg class="hide-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';

  function add(input) {
    if (input.dataset.pwEye) return;
    input.dataset.pwEye = '1';
    var wrap = document.createElement('span');
    wrap.className = 'pw-wrap';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pw-eye';
    btn.setAttribute('aria-label', 'Show password');
    btn.setAttribute('aria-pressed', 'false');
    btn.title = 'Show password';
    btn.innerHTML = EYE + EYE_OFF;
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); }); // keep the cursor in the field
    btn.addEventListener('click', function () {
      var show = input.type === 'password';
      var start = input.selectionStart, end = input.selectionEnd;
      input.type = show ? 'text' : 'password';
      btn.setAttribute('aria-pressed', String(show));
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      btn.title = show ? 'Hide password' : 'Show password';
      try { input.focus(); input.setSelectionRange(start, end); } catch (e) {}
    });
    // Never submit a visible password: hide it again on submit.
    if (input.form) input.form.addEventListener('submit', function () { input.type = 'password'; });
    wrap.appendChild(btn);
  }

  function run() { document.querySelectorAll('input[type="password"]').forEach(add); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run); else run();
})();
</script>
