{% with u=request.resolver_match.url_name %}
  <header class="st-header" id="stHeader">
    <div class="st-wrap st-header__bar">
      <a href="{% url 'index' %}" class="st-logo" aria-label="SudoTag home">SudoTag<i aria-hidden="true"></i></a>

      <nav class="st-nav" id="stNav" aria-label="Main">
        <a href="{% url 'how_it_works' %}"{% if u == 'how_it_works' %} class="is-active" aria-current="page"{% endif %}>How it works</a>
        <a href="{% url 'features' %}"{% if u == 'features' %} class="is-active" aria-current="page"{% endif %}>Features</a>
        <a href="{% url 'fleet' %}"{% if u == 'fleet' %} class="is-active" aria-current="page"{% endif %}>Fleet <span class="st-soon">Soon</span></a>
        <a href="{% url 'help' %}"{% if u == 'help' %} class="is-active" aria-current="page"{% endif %}>Help</a>
        <a href="{% url 'buy_now' %}" class="st-nav__mobile-only">Buy SudoTag</a>
      </nav>

      <div class="st-header__actions">
        <button type="button" class="st-iconbtn" id="stTheme" aria-label="Switch to light mode">
          <i class="bi bi-sun" aria-hidden="true"></i><i class="bi bi-moon-stars" aria-hidden="true"></i>
        </button>
        <a class="st-btn st-btn--line st-btn--sm st-hide-sm" href="{% url 'buy_now' %}" data-magnetic>Buy</a>
        <a class="st-btn st-btn--signal st-btn--sm" href="{% if u == 'index' %}#scan{% else %}{% url 'index' %}#scan{% endif %}" data-scan-tab="qr" data-magnetic>
          <i aria-hidden="true"><svg class="st-ico"><use href="#i-scan"/></svg></i><span>Scan</span>
        </a>
        <button type="button" class="st-burger" id="stBurger" aria-label="Open menu" aria-expanded="false" aria-controls="stNav">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>
{% endwith %}
