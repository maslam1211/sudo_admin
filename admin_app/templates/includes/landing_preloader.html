{# Site launch loader — wheel.json visible for the whole loading period #}
<div id="preloader" class="preloader--lottie" aria-busy="true" aria-live="polite" role="status"
     style="position:fixed;inset:0;z-index:2147483646;display:flex;align-items:center;justify-content:center;background:#000;margin:0;padding:0;">
  <div id="preloader-lottie-mount" class="preloader-lottie" aria-hidden="true"
       style="width:min(160px,42vw);height:min(160px,42vw);"></div>
</div>
<script>
(function () {
  var mount = document.getElementById('preloader-lottie-mount');
  var preloader = document.getElementById('preloader');
  if (!preloader) return;

  document.documentElement.classList.add('preloader-pending');
  if (document.body) document.body.classList.add('preloader-active');

  var wheelUrl = window.__SUDO_WHEEL_URL || "{% url 'notify_sending_wheel_json' %}";
  var lottieUrl = window.__SUDO_LOTTIE_URL || "{% url 'landing_asset' asset_path='vendor/lottie/lottie.min.js' %}";

  var dismissed = false;
  var pageLoaded = false;
  var wheelReady = false;
  var wheelStarted = false;
  var startedAt = Date.now();

  /* Show wheel during load; keep it on screen long enough to see */
  var MIN_SHOW_MS = 1600;
  var MAX_WAIT_MS = 10000;

  function tryDismiss() {
    if (dismissed) return;
    var elapsed = Date.now() - startedAt;
    if (elapsed < MIN_SHOW_MS) return;
    /* Prefer waiting until page load + wheel started; after 3s allow dismiss anyway */
    if (!pageLoaded && elapsed < 3000) return;
    if (!wheelReady && !wheelStarted && elapsed < 3500) return;
    dismissNow();
  }

  function dismissNow() {
    if (dismissed) return;
    dismissed = true;
    if (window.__sudoPreloaderLottie) {
      try { window.__sudoPreloaderLottie.destroy(); } catch (e) {}
      window.__sudoPreloaderLottie = null;
    }
    document.documentElement.classList.remove('preloader-pending');
    if (document.body) document.body.classList.remove('preloader-active');
    preloader.dataset.dismissing = '1';
    preloader.style.opacity = '0';
    preloader.style.visibility = 'hidden';
    preloader.style.pointerEvents = 'none';
    window.setTimeout(function () {
      if (preloader && preloader.parentNode) preloader.remove();
      try {
        if (window.AOS && typeof window.AOS.refreshHard === 'function') {
          window.AOS.refreshHard();
        } else if (window.AOS && typeof window.AOS.refresh === 'function') {
          window.AOS.refresh();
        }
      } catch (e) {}
    }, 450);
  }

  window.sudoDismissPreloader = function () {
    pageLoaded = true;
    scheduleTry();
  };

  function scheduleTry() {
    tryDismiss();
    var left = MIN_SHOW_MS - (Date.now() - startedAt);
    if (!dismissed && left > 0) {
      window.setTimeout(tryDismiss, left + 30);
    }
  }

  function markWheelReady() {
    wheelReady = true;
    wheelStarted = true;
    preloader.classList.add('preloader--ready');
    scheduleTry();
  }

  function start(api) {
    if (!mount || !preloader.parentNode || dismissed || wheelStarted) return;
    wheelStarted = true;
    try {
      if (window.__sudoPreloaderLottie) {
        try { window.__sudoPreloaderLottie.destroy(); } catch (e) {}
      }
      mount.innerHTML = '';
      var anim = api.loadAnimation({
        container: mount,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: wheelUrl
      });
      window.__sudoPreloaderLottie = anim;
      if (anim && typeof anim.addEventListener === 'function') {
        anim.addEventListener('DOMLoaded', markWheelReady);
        anim.addEventListener('data_ready', markWheelReady);
        anim.addEventListener('data_failed', markWheelReady);
      }
      /* Fallback if events never fire */
      window.setTimeout(function () {
        if (!wheelReady) markWheelReady();
      }, 900);
    } catch (err) {
      markWheelReady();
    }
  }

  function loadScript(src, onOk, onFail) {
    var s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = function () { onOk && onOk(); };
    s.onerror = function () { onFail && onFail(); };
    document.head.appendChild(s);
  }

  function bootLottie() {
    var api = window.lottie || window.bodymovin;
    if (api) {
      start(api);
      return;
    }
    /* Head may still be downloading Lottie — poll briefly, then load ourselves */
    var tries = 0;
    var poll = window.setInterval(function () {
      tries += 1;
      var a = window.lottie || window.bodymovin;
      if (a) {
        window.clearInterval(poll);
        start(a);
      } else if (tries >= 40) {
        window.clearInterval(poll);
        loadScript(lottieUrl, function () {
          var b = window.lottie || window.bodymovin;
          if (b) start(b);
          else {
            loadScript(
              'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js',
              function () {
                var c = window.lottie || window.bodymovin;
                if (c) start(c);
                else markWheelReady();
              },
              markWheelReady
            );
          }
        }, function () {
          loadScript(
            'https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js',
            function () {
              var c = window.lottie || window.bodymovin;
              if (c) start(c);
              else markWheelReady();
            },
            markWheelReady
          );
        });
      }
    }, 50);
  }

  bootLottie();

  function onPageLoad() {
    pageLoaded = true;
    scheduleTry();
  }

  if (document.readyState === 'complete') {
    /* Fast/cached load — still keep wheel for MIN_SHOW_MS */
    window.setTimeout(onPageLoad, 0);
  } else {
    window.addEventListener('load', onPageLoad);
  }

  window.setTimeout(function () {
    pageLoaded = true;
    wheelReady = true;
    dismissNow();
  }, MAX_WAIT_MS);

  window.setTimeout(scheduleTry, MIN_SHOW_MS + 40);
})();
</script>
