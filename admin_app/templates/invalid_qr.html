{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Invalid QR Code | SudoTag</title>
  {% include 'includes/qr_flow_head.html' %}
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/sudo_mobile_flow.css' %}" rel="stylesheet">
</head>
<body class="sudo-mobile-flow sudo-error-page">
  <header class="app-header sudo-app-header">
    <a href="/" class="brand-logo" aria-label="SudoTag home">
      <img src="{% url 'brand_logo_png' %}" alt="SudoTag" class="brand-logo-img" width="224" height="114" decoding="async">
    </a>
    <h1 class="header-title">QR SCAN</h1>
  </header>

  <main class="app-main sudo-app-main sudo-error-main">
    <article class="sudo-error-card error-card" role="alert" aria-live="polite">
      <div class="sudo-error-icon-wrap" aria-hidden="true">
        <i class="bi bi-qr-code-scan"></i>
      </div>
      <p class="sudo-error-eyebrow">Invalid code</p>
      <h1 class="sudo-error-title">This QR code isn’t valid</h1>
      <p class="sudo-error-message">
        {{ error|default:"The QR code you scanned is not registered in our system." }}
      </p>
      <p class="sudo-error-hint">Check that you scanned the correct SudoTag sticker, then try again.</p>
      <div class="sudo-error-actions">
        <a href="https://sudo-70852.firebaseapp.com" class="sudo-error-btn sudo-error-btn--primary btn-home">
          <i class="bi bi-house-door-fill" aria-hidden="true"></i>
          Return home
        </a>
        <button type="button" class="sudo-error-btn sudo-error-btn--ghost" onclick="history.back()">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          Scan again
        </button>
      </div>
    </article>
  </main>
</body>
</html>
