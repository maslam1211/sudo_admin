name: tests

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sudotag
          POSTGRES_PASSWORD: sudotag
          POSTGRES_DB: sudotag
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sudotag" --health-interval 5s
          --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        database: [postgres, sqlite]
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: '0'
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://sudotag:sudotag@127.0.0.1:5432/sudotag' || '' }}
      SCHEDULED_PUSH_IN_WEB: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
